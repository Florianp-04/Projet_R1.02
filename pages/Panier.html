<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="utf-8">
        <title>grokeba</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/global.css">
        <link rel="stylesheet" href="../css/panier.css" id="panierCSS">
        <script src="../js/panier.js" defer></script>
        <script src="../js/global.js" defer></script>
    </head>

    <body>
        <header id="header">
            <nav class="headerNav">
                <ul>
                    <li><a href="../index.html"><img class="headerLogo" src="../img/LogoGrokeba.png" alt="Logo de Grokeba"></a></li>
                    <li><button type="button" class="buttonLightDark" id="buttonLightDarkPanier" aria-pressed="false">DARK</button></li>
                    <li class="headerNavli">
                        <ul class="headerNavul" id="headerNavulJS">
                            <li class="headerNavButton"><a href="../index.html" class="headerNavButtonAccueil">Accueil</a></li>
                            <li class="headerNavButton"><a href="Magasin.html" class="headerNavButtonMagasin">Magasin</a></li>
                            <li class="headerNavButton"><a href="Panier.html" class="headerNavButtonPanier">Panier</a></li>
                        </ul>
                    </li>
                    <li><button type="button" id="headerMobButton">☰</button></li>
                </ul>
            </nav>
            
        </header>

        <section>
            <h1>VOTRE PANIER</h1>
            <form>
                <h2>Vos produits</h2>
                <ul class="panierFormUl">
                    <li>
                        <figure>
                            <img src="../img/Salade.png" class="panierFormImg" alt="Image de salades">
                            <figcaption>
                                <h3>Salades</h3>
                                Une salade fraiche, tout juste cueillit avant de vous être livrée.
                            </figcaption>
                            <fieldset>
                                <button type="button" class="panierFormButton" id="buttonMinusSalade">-</button>
                                <label for="valSalade"></label>
                                <input type="text" name="valSalade" value="0" class="panierFormVal" id="valSalade">
                                <button type="button" class="panierFormButton" id="buttonPlusSalade">+</button>
                            </fieldset>
                        </figure>

                    </li>
                    <li class="panierFormli">
                        
                        <figure>
                            <img src="../img/Tomates.png" class="panierFormImg" alt="Image de tomates">
                            <figcaption>
                                <h3>Tomates</h3>
                                Des tomates de bonnes qualités qui ont du goût.                         
                            </figcaption>
                            <fieldset>
                                <label for="valTomates"></label>
                                <button type="button" class="panierFormButton" id="buttonMinusTomates">-</button>
                                <input type="text" name="valTomates" class="panierFormVal" value="0" id="valTomates">
                                <button type="button" class="panierFormButton" id="buttonPlusTomates">+</button>
                            </fieldset>
                        </figure>
                        
                        
                    </li>
                    <li class="panierFormli">
                        
                        <figure>
                            <img src="../img/Oignons.png" class="panierFormImg" alt="Image d'oignons">
                            <figcaption>
                                <h3>Oignons</h3>
                                Des oignons parfaits pour la réalisation de kebab, donnant un goût supplémentaire.
                            </figcaption>
                            <fieldset>
                                <label for="valOignons"></label>
                                <button type="button" class="panierFormButton" id="buttonMinusOignons">-</button>
                                <input type="text" name="valOignons" class="panierFormVal" value="0" id="valOignons">
                                <button type="button" class="panierFormButton" id="buttonPlusOignons">+</button>
                            </fieldset>
                        </figure>
                        
                    </li>
                </ul>
            </form>
            <div class="endPanierButton">
                <button popovertarget="popupAvis" class="formAvisButton">Laisser un commentaire</button>
                <button class="formValiderPanier" popovertarget="surprise">Valider le panier</button>
            </div>
            <img src="../img/videocourte.gif" id="surprise" popover>
            
            <form id="popupAvis" popover action="mailto:grokeba@gmail.com" method="post" enctype="text/plain">
                <h2>Formulaire</h2>
                <fieldset class="formF1">
                    <legend>Nom complet :</legend>

                    <label for="nom">Nom</label>
                    <input type="text" name="nom" placeholder="NOM">

                    <label for="prenom">Prénom</label>
                    <input type="text" name="prenom" placeholder="Prénom">
                </fieldset>
                <fieldset class="formF2">
                    <legend>Vos informations :</legend>

                    <label for="tel">Numéro de téléphone</label>
                    <input type="tel" name="tel" placeholder="06 01 02 70 60">

                    <label for="mail">Adresse mail</label>
                    <input type="email" name="mail" placeholder="Email">
                </fieldset>
                <fieldset class="formF3">
                    <legend>Commentaire</legend>
                    <label for="avis">Commentaire</label>
                    <input type="text" name="avis" placeholder="Laissez votre commentaire ici">
                </fieldset>
                <input type="reset" id="formButtonReset">
                <input type="submit" id="formButtonSend">
            </form>
        </section>
        <a id="top" href="#header">TOP</a>
        <footer>
            <img id="footerNavLogo" src="../img/LogoGrokeba.png" alt="Logo de Grokeba">

            <div class="footerDivNav footerDivRS">
                <h2>Réseaux Sociaux</h2>
                <nav class="footerNavRS">
                    <ul>
                        <li id="discord"><a href="">Discord</a></li>
                        <li id="instagram"><a href="">Instagram</a></li>
                        <li id="facebook"><a href="">Facebook</a></li>
                    </ul>
                </nav>
            </div>
            
            <div class="footerDivNav footerDivSite">
                <h2>Visitez notre site</h2>
                <nav class="footerNavSite">
                    <ul>
                        <li><a href="../index.html">Accueil</a></li>
                        <li><a href="Magasin.html">Magasin</a></li>
                        <li><a href="Panier.html">Panier</a></li>
                    </ul>
                </nav>
            </div>
            
        </footer>
    </body>

</html>
